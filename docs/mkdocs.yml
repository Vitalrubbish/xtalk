site_name: xtalk
docs_dir: .
theme:
  name: material
  language: en
plugins:
  - search:
      separator: '[\s\u200b\-]'
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
extra:
  alternate:
    - name: English
      link: /en/ 
      lang: en
    - name: 简体中文
      link: /zh/
      lang: zh
nav:
  - Home: 
      - index.md
  - Tutorial:
      - Testing:
        - tutorial/testing.md